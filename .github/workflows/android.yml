# Builds and tests the Android app (android/) when it changes.
# The APK is attached to each run: Actions > the run > Artifacts > FranzPLAY-android.
name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch: # "Run workflow" button: builds a fresh APK whenever you want

permissions:
  contents: read

jobs:
  apk:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Also checks that gradle-wrapper.jar is the real one from Gradle.
      - uses: gradle/actions/setup-gradle@v4

      # The signing key lives in the repository's secrets, never in the code.
      # Without it the APK is signed with a temporary key (see docs/app-android.md).
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/franzplay.jks"
            echo "FRANZPLAY_KEYSTORE_FILE=$RUNNER_TEMP/franzplay.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a temporary key."
          fi

      - name: Test, lint and build
        env:
          FRANZPLAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FRANZPLAY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FRANZPLAY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon test lint assembleRelease -PversionCode=${{ github.run_number }}

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk FranzPLAY.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FranzPLAY-android
          path: android/FranzPLAY.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lint-report
          path: android/app/build/reports/
          if-no-files-found: ignore
