# Runs on every push and pull request: if anything fails, the change does not go in.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - name: Install ffmpeg (some tests run the real ffprobe and ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run tests
        run: go test -race ./...

  web:
    name: Web interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint, type-check and test
        run: npm run check
      - name: Build
        run: npm run build

  e2e:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - name: Install ffmpeg (FranzPLAY makes covers; the test makes its videos)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build FranzPLAY, interface included
        run: make build
      - name: Install the browser checks
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Lint the browser checks
        working-directory: e2e
        run: npm run check
      - name: Open every page and play a video, on a computer and a phone
        working-directory: e2e
        run: npx playwright test
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 } # Raspberry Pi 4/5, ZimaBlade
          - { goos: linux, goarch: arm, goarm: "7" } # older Raspberry Pi
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/franzplay
