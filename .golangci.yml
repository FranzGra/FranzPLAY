# Lint rules for FranzPLAY. Run locally with: make lint
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
  settings:
    misspell:
      # Italian names of the old FranzPLAY's database columns, read by the import.
      ignore-rules:
        - preferenze
        - progresso

formatters:
  enable:
    - gofmt
    - goimports
